[project]
name = "portal_client"
version = "3.5.0"
description = "Client to interact with Portal's API for application & user management"
authors = [
    { name = "Benedikt Reiser", email = "benedikt.reiser@innoactive.de" },
]
requires-python = ">=3.10"
readme = "readme.md"
license = { text = "Apache2" }
dependencies = ["requests", "backoff", "tqdm"]

[project.scripts]
innoactive-portal = "portal_client.__main__:main"

[tool.setuptools]
# Pin the package explicitly so the build does not rely on flat-layout auto-discovery,
# which fails when other top-level directories (tests, specs, ...) are present.
packages = ["portal_client"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["requests-mock", "pytest", "ruff>=0.11.8"]

[tool.uv]
# Build and install the project into the environment so the `innoactive-portal`
# console script is available via `uv run` (matches what pip-installed users get).
package = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
