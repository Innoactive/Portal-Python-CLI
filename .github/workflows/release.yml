name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so semantic-release can determine the next version.
          fetch-depth: 0
          # Must be false: otherwise checkout stores the default GITHUB_TOKEN as a git
          # auth header and the release push would use it (github-actions[bot], which is
          # NOT on main's bypass list → GH006). With no persisted credentials, the push
          # uses the app token below instead.
          persist-credentials: false
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # the semantic-release-innoactive GitHub App; the token is scoped to this repository
          client-id: Iv23li5KyqO4ET5ySTXk
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        with:
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
        env:
          # The app pushes the @semantic-release/git version-bump commit and, unlike
          # GITHUB_TOKEN, creates a release that triggers `release` workflows.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
